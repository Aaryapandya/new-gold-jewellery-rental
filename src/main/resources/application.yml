server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: gold-jewellery-rental

  # ─── DataSource ───────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/gold_rental
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      # Connection pool sizing (guideline: DbConnectionPooling)
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000        # 30 seconds
      idle-timeout: 600000             # 10 minutes
      max-lifetime: 1800000            # 30 minutes
      connection-test-query: SELECT 1

  # ─── JPA / Hibernate ──────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update                  # Hibernate creates/updates tables from entities automatically
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC

  # ─── Flyway ───────────────────────────────────────────────
  flyway:
    enabled: false                      # Hibernate manages schema directly; Flyway not needed

  # ─── Multipart (file uploads) ─────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

# ─── Application-level secrets (injected from env) ────────────
app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTThatIsAtLeast256BitsLongForHS256Algorithm}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}        # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

  # ─── Cloudinary (guideline: NoHardcodedSecrets) ───────────
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
    api-key: ${CLOUDINARY_API_KEY:your_api_key}
    api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}

  # ─── Business constants ───────────────────────────────────
  booking:
    max-advance-days: 90          # Cannot book more than 90 days in advance
    min-rental-hours: 4           # Minimum booking duration

  search:
    default-radius-km: 50
    max-radius-km: 500

  # ─── Bootstrap Admin (first admin seeded at startup) ─────
  admin:
    email: ${ADMIN_EMAIL:admin@goldrental.com}
    password: ${ADMIN_PASSWORD:Admin@1234}
    name: ${ADMIN_NAME:Platform Admin}

# ─── Actuator ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ─── Logging ──────────────────────────────────────────────────
logging:
  level:
    com.goldrental: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
